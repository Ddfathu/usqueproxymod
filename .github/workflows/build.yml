name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run with tmate debugging"
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Accept Android Licenses & Install SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Make scripts executable
        run: |
          chmod +x gradlew || true
          chmod +x build-usque.sh || true

      - name: Build usque AAR (arm64 only)
        run: bash build-usque.sh

      - name: Setup Keystore (if provided)
        if: ${{ env.KEYSTORE_EXISTS != '' }}
        env:
          KEYSTORE_EXISTS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          printf '%s\n' \
            "storeFile=keystore.jks" \
            "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" \
            "keyAlias=${{ secrets.KEY_ALIAS }}" \
            "keyPassword=${{ secrets.KEY_PASSWORD }}" \
            > keystore.properties

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Build APK (Release Mode)
        run: ./gradlew assembleRelease

      - name: Collect Release APK
        run: |
          mkdir -p artifacts
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} artifacts/usqueproxy-mod.apk \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: usqueproxy-mod
          path: artifacts/usqueproxy-mod.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/usqueproxy-mod.apk
