name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: "Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)"
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Make scripts executable
        run: |
          chmod +x gradlew || true
          chmod +x build-usque.sh || true

      - name: Build usque AAR
        run: bash build-usque.sh

      - name: Setup Keystore
        if: ${{ env.KEYSTORE_EXISTS != '' }}
        env:
          KEYSTORE_EXISTS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/keystore.jks
          printf '%s\n' \
            "storeFile=keystore.jks" \
            "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" \
            "keyAlias=${{ secrets.KEY_ALIAS }}" \
            "keyPassword=${{ secrets.KEY_PASSWORD }}" \
            > keystore.properties

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Rename & Organize APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/*.apk artifacts/ || true
          cd artifacts
          for f in *.apk; do
            [ -f "$f" ] && mv "$f" "UsqueProxy-arm64-v8a.apk"
          done

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UsqueProxy-Release
          path: artifacts/*.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
